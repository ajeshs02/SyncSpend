// Types the Compose compiler must treat as stable.
//
// Comments use "//", not "#", and only at the start of a line.
//
// java.time values are deeply immutable by contract but predate the
// @Stable/@Immutable annotations, so without this line every composable
// taking a LocalDate/YearMonth/etc. becomes non-skippable.
java.time.*

// Room hands back concrete immutable lists, but List/Map are interfaces and
// so unstable by inference unless the state holder itself is @Immutable.
kotlin.collections.*
